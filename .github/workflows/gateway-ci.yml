name: Gateway CI

on:
  push:
    branches:
      - main
      - feat/**
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-ci.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test OAuth client scope and dispatch guards
        run: node --test tests/oauth-client-policy.test.mjs
      - name: Verify safe OAuth live-smoke script (do not make network calls)
        run: |
          node --check tests/oauth-site-live-smoke.mjs
          node tests/oauth-site-live-smoke.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check OAuth and device gateway
        run: deno check gateway/oauth-pc-agent/index.ts gateway/pc-agent-device/index.ts
