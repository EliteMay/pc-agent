name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify tag matches bundle versions
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          [xml]$project = Get-Content 'manager\PcAgentManager\PcAgentManager.csproj'
          $managerVersion = [string]$project.Project.PropertyGroup.Version
          $agentVersion = (Get-Content 'agent\package.json' -Raw | ConvertFrom-Json).version

          if ($managerVersion -ne $tagVersion) {
            throw "Manager version $managerVersion does not match tag $tagVersion"
          }

          if ($agentVersion -ne $tagVersion) {
            throw "Agent version $agentVersion does not match tag $tagVersion"
          }

      - name: Node tests
        working-directory: agent
        run: npm test

      - name: Restore Manager
        run: dotnet restore manager/PcAgentManager/PcAgentManager.csproj

      - name: Restore Manager tests
        run: dotnet restore manager/PcAgentManager.Tests/PcAgentManager.Tests.csproj

      - name: Build Manager
        run: dotnet build manager/PcAgentManager/PcAgentManager.csproj -c Release --no-restore

      - name: Manager regression tests
        run: dotnet run --project manager/PcAgentManager.Tests/PcAgentManager.Tests.csproj -c Release --no-restore

      - name: Publish Manager
        run: dotnet publish manager/PcAgentManager/PcAgentManager.csproj -c Release --no-restore -o dist/manager

      - name: Assemble portable Windows app
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'dist\pc-agent-manager-win-x64'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle 'Runtime') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle 'Agent') | Out-Null

          Copy-Item 'dist\manager\*' $bundle -Recurse -Force
          Copy-Item (Get-Command node).Source (Join-Path $bundle 'Runtime\node.exe') -Force
          Copy-Item 'agent\bin' (Join-Path $bundle 'Agent\bin') -Recurse -Force
          Copy-Item 'agent\src' (Join-Path $bundle 'Agent\src') -Recurse -Force
          Copy-Item 'agent\package.json' (Join-Path $bundle 'Agent\package.json') -Force

          $manager = Join-Path $bundle 'PcAgentManager.exe'
          $check = Start-Process -FilePath $manager -ArgumentList '--bundle-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) {
            throw "Bundle check failed with exit code $($check.ExitCode)"
          }

          Get-FileHash $manager -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  PcAgentManager.exe" } |
            Set-Content (Join-Path $bundle 'SHA256SUMS.txt')

      - name: Build release archive and checksum
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'dist\pc-agent-manager-win-x64'
          $archive = Join-Path $PWD 'dist\pc-agent-manager-win-x64.zip'
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $archive -CompressionLevel Optimal

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  pc-agent-manager-win-x64.zip" |
            Set-Content "$archive.sha256" -NoNewline

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist\pc-agent-manager-win-x64.zip" "dist\pc-agent-manager-win-x64.zip.sha256" --repo "$env:GITHUB_REPOSITORY" --title "PC Agent $env:GITHUB_REF_NAME" --generate-notes
