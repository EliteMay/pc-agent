name: OAuth Pages
on:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/oauth-pages.test.mjs'
      - '.github/workflows/oauth-pages.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/oauth-pages.test.mjs'
      - '.github/workflows/oauth-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test OAuth static frontend
        run: node --test tests/oauth-pages.test.mjs
      - name: Check live published Pages (read-only)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="https://elitemay.github.io/pc-agent"
          for entry in "|Kaito PC Agent" "/oauth/login/|OAuthログイン" "/oauth/consent/|Kaito PC Agentへの接続を許可"; do
            path="${entry%%|*}"
            expected="${entry#*|}"
            url="${base}${path}"
            valid=0
            for attempt in $(seq 1 6); do
              if curl --fail --location --silent --show-error --max-time 15 "${url}" -o response.html && grep -Fq "${expected}" response.html; then
                echo "Live page verified: ${url}"
                valid=1
                break
              fi
              sleep 3
            done
            test "${valid}" -eq 1 || { echo "::error::Failed verifying ${url}"; exit 1; }
          done

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: oauth-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only OAuth frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live OAuth pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://elitemay.github.io/pc-agent"
          for entry in "|Kaito PC Agent" "/oauth/login/|OAuthログイン" "/oauth/consent/|Kaito PC Agentへの接続を許可"; do
            path="${entry%%|*}"
            expected="${entry#*|}"
            url="${base}${path}"
            valid=0
            for attempt in $(seq 1 12); do
              if curl --fail --location --silent --show-error --max-time 20 "${url}" -o response.html && grep -Fq "${expected}" response.html; then
                echo "Verified live page: ${url}"
                valid=1
                break
              fi
              echo "Retrying live page ${url} (attempt ${attempt}/12)"
              sleep 5
            done
            if [ "${valid}" -ne 1 ]; then
              echo "::error::Page did not return expected content: ${url}"
              exit 1
            fi
          done
