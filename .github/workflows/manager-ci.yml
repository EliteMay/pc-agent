name: Manager CI

on:
  push:
    branches:
      - main
      - feat/**
    paths:
      - 'manager/**'
      - 'agent/**'
      - '.github/workflows/manager-ci.yml'
  pull_request:
    paths:
      - 'manager/**'
      - 'agent/**'
      - '.github/workflows/manager-ci.yml'

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node tests
        working-directory: agent
        run: npm test

      - name: Restore Manager
        run: dotnet restore manager/PcAgentManager/PcAgentManager.csproj

      - name: Restore Manager tests
        run: dotnet restore manager/PcAgentManager.Tests/PcAgentManager.Tests.csproj

      - name: Build Manager
        run: dotnet build manager/PcAgentManager/PcAgentManager.csproj -c Release --no-restore

      - name: Manager regression tests (real cross-user Windows ACL gate)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # GitHub-hosted Windows runners are temporary VMs. Create a separate
          # unprivileged Windows identity for a REAL kernel access check.
          # Never use a user's existing account or store/log the password.
          $account = 'paacl' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          $password = 'A!b1' + [guid]::NewGuid().ToString('N')
          $created = $false
          try {
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            New-LocalUser -Name $account -Password $secure -Description 'Temporary PC Agent pipe ACL regression probe' | Out-Null
            $created = $true
            $env:PC_AGENT_TEST_ALT_USER = $account
            $env:PC_AGENT_TEST_ALT_PASSWORD = $password
            $env:PC_AGENT_REQUIRE_ALT_USER_TEST = '1'

            dotnet run --project manager/PcAgentManager.Tests/PcAgentManager.Tests.csproj -c Release --no-restore
            if ($LASTEXITCODE -ne 0) {
              throw "Manager regression tests failed (exit $LASTEXITCODE)"
            }
          } finally {
            Remove-Item Env:PC_AGENT_TEST_ALT_USER -ErrorAction SilentlyContinue
            Remove-Item Env:PC_AGENT_TEST_ALT_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item Env:PC_AGENT_REQUIRE_ALT_USER_TEST -ErrorAction SilentlyContinue
            $password = $null
            $secure = $null
            if ($created) {
              Remove-LocalUser -Name $account -ErrorAction Stop
            }
          }

      - name: Publish Manager
        run: dotnet publish manager/PcAgentManager/PcAgentManager.csproj -c Release --no-restore -o dist/manager

      - name: Assemble portable Windows app
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'dist\pc-agent-manager-win-x64'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle 'Runtime') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle 'Agent') | Out-Null

          Copy-Item 'dist\manager\*' $bundle -Recurse -Force
          Copy-Item (Get-Command node).Source (Join-Path $bundle 'Runtime\node.exe') -Force
          Copy-Item 'agent\bin' (Join-Path $bundle 'Agent\bin') -Recurse -Force
          Copy-Item 'agent\src' (Join-Path $bundle 'Agent\src') -Recurse -Force
          Copy-Item 'agent\package.json' (Join-Path $bundle 'Agent\package.json') -Force

          $manager = Join-Path $bundle 'PcAgentManager.exe'
          $check = Start-Process -FilePath $manager -ArgumentList '--bundle-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) {
            throw "Bundle check failed with exit code $($check.ExitCode)"
          }

          Get-FileHash $manager -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  PcAgentManager.exe" } |
            Set-Content (Join-Path $bundle 'SHA256SUMS.txt')

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: pc-agent-manager-win-x64
          path: dist/pc-agent-manager-win-x64
          if-no-files-found: error
          retention-days: 14
