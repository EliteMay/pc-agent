<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaito PC Agent OAuth</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;background:#0d1117;color:#e6edf3;min-height:100vh;display:grid;place-items:center}.card{width:min(560px,calc(100% - 32px));background:#161b22;border:1px solid #30363d;border-radius:16px;padding:24px;box-sizing:border-box}h1{font-size:22px;margin:0 0 12px}p{color:#9da7b3;line-height:1.6}.app{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:14px;margin:16px 0}.actions{display:flex;gap:10px;margin-top:20px}button{flex:1;border:0;border-radius:9px;padding:12px;font-weight:700;cursor:pointer}.allow{background:#238636;color:#fff}.deny{background:#30363d;color:#fff}.status{font-size:14px;margin-top:14px}.error{color:#ff7b72}
</style>
</head>
<body><main class="card">
<h1>Kaito PC Agentへの接続を許可</h1>
<p>ChatGPTなどのOAuthクライアントが、このSupabaseアカウントを使ってKaito PC Agent MCPへ接続しようとしています。</p>
<div class="app" id="details">認可情報を確認しています…</div>
<div class="actions"><button class="deny" id="deny" disabled>拒否</button><button class="allow" id="allow" disabled>許可</button></div>
<div class="status" id="status"></div>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://vtnwbgejlaqpnwmlzbjy.supabase.co";
const SUPABASE_KEY="sb_publishable_qMrXUwMbI0MjhYreNW4IJw_KCX_n5os";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const details=document.querySelector("#details"), status=document.querySelector("#status");
const allow=document.querySelector("#allow"), deny=document.querySelector("#deny");
const authorizationId=new URLSearchParams(location.search).get("authorization_id");
const fail=(m)=>{status.className="status error";status.textContent=m};

async function load(){
  if(!authorizationId){
    fail("authorization_id がありません。OAuth認可URLから開いてください。");
    details.textContent="認可要求を読み込めません。";
    return;
  }

  const {data:{user}}=await supabase.auth.getUser();
  if(!user){
    sessionStorage.setItem("oauth_return",location.href);
    location.href="../login/";
    return;
  }

  const {data,error}=await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
  if(error){fail(error.message);return}
  if(!data){fail("認可情報を取得できませんでした。");return}

  // すでに同意済みの場合、Supabaseは authorization_id ではなく redirect_url を返す。
  if(!("authorization_id" in data)){
    if(data.redirect_url){
      sessionStorage.removeItem("oauth_return");
      location.assign(data.redirect_url);
      return;
    }
    fail("OAuthの戻り先URLを取得できませんでした。");
    return;
  }

  const name=data?.client?.name||data?.client_name||"OAuth client";
  const scopes=(data?.scope||"").trim();
  details.textContent=name+" がアクセス許可を要求しています。"+(scopes?"\n要求スコープ: "+scopes:"");
  allow.disabled=false;
  deny.disabled=false;
}

allow.onclick=async()=>{
  allow.disabled=deny.disabled=true;
  status.className="status";
  status.textContent="許可しています…";
  const {data,error}=await supabase.auth.oauth.approveAuthorization(authorizationId);
  if(error){allow.disabled=deny.disabled=false;return fail(error.message)}
  if(!data?.redirect_url){allow.disabled=deny.disabled=false;return fail("OAuthの戻り先URLを取得できませんでした。")}
  sessionStorage.removeItem("oauth_return");
  location.assign(data.redirect_url);
};

deny.onclick=async()=>{
  allow.disabled=deny.disabled=true;
  status.className="status";
  status.textContent="拒否しています…";
  const {data,error}=await supabase.auth.oauth.denyAuthorization(authorizationId);
  if(error){allow.disabled=deny.disabled=false;return fail(error.message)}
  if(!data?.redirect_url){allow.disabled=deny.disabled=false;return fail("OAuthの戻り先URLを取得できませんでした。")}
  sessionStorage.removeItem("oauth_return");
  location.assign(data.redirect_url);
};

load();
</script></body></html>
