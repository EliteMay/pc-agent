<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaito OAuth Login</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;background:#0d1117;color:#e6edf3;min-height:100vh;display:grid;place-items:center}.card{width:min(460px,calc(100% - 32px));background:#161b22;border:1px solid #30363d;border-radius:16px;padding:24px;box-sizing:border-box}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;margin-top:10px}input{background:#0d1117;border:1px solid #30363d;color:#fff}button{border:0;background:#238636;color:#fff;font-weight:700}.s{color:#9da7b3;font-size:14px;margin-top:12px}.e{color:#ff7b72}</style></head><body><main class="card"><h1>OAuthログイン</h1><p>Supabaseアカウントで認証します。</p><input id="email" type="email" autocomplete="email" placeholder="メールアドレス"><input id="password" type="password" autocomplete="current-password" placeholder="パスワード"><button id="login">ログイン</button><div class="s" id="status"></div></main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://vtnwbgejlaqpnwmlzbjy.supabase.co","sb_publishable_qMrXUwMbI0MjhYreNW4IJw_KCX_n5os");
const status=document.querySelector("#status"),btn=document.querySelector("#login");
const {data:{session}}=await supabase.auth.getSession();if(session){location.href=sessionStorage.getItem("oauth_return")||"../consent/"}
btn.onclick=async()=>{btn.disabled=true;status.className="s";status.textContent="ログインしています…";const {error}=await supabase.auth.signInWithPassword({email:document.querySelector("#email").value,password:document.querySelector("#password").value});if(error){status.className="s e";status.textContent=error.message;btn.disabled=false;return}location.href=sessionStorage.getItem("oauth_return")||"../consent/"};
</script></body></html>
